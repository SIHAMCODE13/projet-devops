# Stack complète : API + Nginx (reverse proxy) + Prometheus + Grafana
#
#   docker compose up --build            -> mode développement (charge docker-compose.override.yml)
#   docker compose -f docker-compose.yml up -d --build   -> mode production (sans override)

services:
  app:
    build: .
    image: health-service-app:local
    container_name: health-service-app
    environment:
      SERVICE_NAME: ${SERVICE_NAME:-health-service}
      SERVICE_VERSION: ${SERVICE_VERSION:-1.0.0}
    ports:
      - "8000:8000"
    networks:
      - devops-network
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: health-service-nginx
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8089:80"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - devops-network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - app
    networks:
      - devops-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.1
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - devops-network
    restart: unless-stopped

networks:
  devops-network:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
