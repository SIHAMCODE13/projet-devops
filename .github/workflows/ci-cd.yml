name: CI/CD Health Service

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Run tests
        run: python -m pytest --cov=app --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    needs: build-and-test
    # Le push vers Docker Hub n'a lieu que sur un push dans main (jamais sur une pull request)
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build image (pull request, sans publication)
        if: env.PUBLISH != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: health-service-app:ci
          cache-from: type=gha

      - name: Build and push image (main)
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/health-service-app:latest
            ${{ secrets.DOCKER_USERNAME }}/health-service-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
